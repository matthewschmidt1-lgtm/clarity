<!DOCTYPE html><html><head><meta charset="utf-8"><title>Clarity engine tests</title></head><body>
<pre id="out"></pre>
<script src="../js/content.js"></script><script src="../js/engine.js"></script>
<script>
(async () => {
  const data = await (await fetch("scenarios.json")).json();
  const mk = sc => {
    const s = { title: sc.title, options: sc.options.map((l, i) => ({ id: "o" + i, label: l })), criteria: sc.criteria.map(([id, label, importance]) => ({ id, label, importance })), evals: {}, notes: JSON.parse(JSON.stringify(sc.notes || {})), ruledOut: JSON.parse(JSON.stringify(sc.ruledOut || {})) };
    for (const id in sc.evals) { const e = sc.evals[id]; s.evals[id] = { pref: e.pref, conf: e.conf, ratings: {} }; if (e.ratings) s.options.forEach(o => { s.evals[id].ratings[o.id] = e.ratings[o.label]; }); }
    return s;
  };
  const setPath = (s, path, v) => {
    const [root, key, field] = path.split(".");
    if (root === "criteria") s.criteria.find(c => c.id === key)[field] = v;
    else if (root === "evals") s.evals[key][field] = v;
    else if (root === "notes") s.notes[key] = v;
    else if (root === "ruledOut") s.ruledOut[key] = v;
  };
  const textOf = r => [r.matters.join(" "), ...(r.reframe || []), ...r.clear.map(x => x.text), ...r.same.map(x => x.text), ...r.unsure.map(x => x.text), r.tensionLine.text, r.observation, r.pivotBlock, r.stability, r.changeMind, r.learn && r.learn.text, r.learn && r.learn.rest.join(" "), r.settled && r.settled.title, r.settled && r.settled.body, r.pivot.question, r.pivot.statement].filter(Boolean).join(" ");
  const results = [], muts = [];
  for (const sc of data.scenarios) {
    const s = mk(sc.session), e = sc.expect, m = Engine.model(s), r = Engine.report(s), all = textOf(r);
    const checks = []; const chk = (name, ok, got) => checks.push({ name, ok: !!ok, got });
    if (e.pivot_kind) chk("pivot: kind", m.pivot.kind === e.pivot_kind, m.pivot.kind);
    if (e.pivot_criterion) chk("pivot: criterion", m.pivot.criterion === e.pivot_criterion, m.pivot.criterion);
    if (e.pivot_contains) chk("pivot: wording", (m.pivot.question || "").includes(e.pivot_contains), m.pivot.question);
    if (e.next_criterion) chk("pivot: next after hope", r.pivot.next && r.pivot.next.c.label === e.next_criterion, r.pivot.next && r.pivot.next.c.label);
    if (e.leader) chk("model: leader", m.leader === e.leader, m.leader);
    if (e.flippable) e.flippable.forEach(n => chk(`sensitivity: ${n} can flip`, m.criteria.find(c => c.name === n).flippable, ""));
    if (e.not_flippable) e.not_flippable.forEach(n => chk(`sensitivity: ${n} cannot flip`, !m.criteria.find(c => c.name === n).flippable, ""));
    if ("reframe" in e) chk("intent: reframe present", !!r.reframe === e.reframe, r.reframe ? r.reframe[0] : null);
    if (e.text_contains) chk(`writing: says "${e.text_contains}"`, all.includes(e.text_contains), "");
    chk("writing: no 'comes out ahead'", !/comes out ahead/.test(all), "");
    chk("writing: no 'Less important:'", !/Less important:/.test(all), "");
    if (e.options_count) chk("model: options", m.decision.options.length === e.options_count, m.decision.options.length);
    // invariants, every scenario
    chk("no score shown: report text has no digits or percent", !/[0-9%]/.test(all), (all.match(/[0-9%]/g) || []).slice(0, 3).join(""));
    chk("agency: never says what to choose", !/you should (take|stay|leave|move|buy|choose|go)|we recommend|the right choice|(\bwins\b)/i.test(all), "");
    chk("boundary: no claim of completeness or certainty", !/\b(everything that matters|the real crux|definitely|certainly|without doubt)\b/i.test(all), "");
    const names = s.criteria.map(c => c.label.toLowerCase());
    const mentioned = (all.match(/stronger on ([a-z\-' ]+?)[\.\?\"]/g) || []).map(x => x.replace(/stronger on |[\.\?\"]/g, "").trim()).filter(x => !/you named|everything/.test(x));
    chk("fidelity: only criteria the person named", mentioned.every(x => names.includes(x)), mentioned.filter(x => !names.includes(x)).join(", "));
    if (m.all_known) chk("no-pivot: none manufactured when all known", m.pivot.kind === "none", m.pivot.kind);
    if (m.pivot.kind === "none" || m.pivot.kind === "robust") chk("no-pivot: report never says Pivot", !!r.settled && !/pivot/i.test(JSON.stringify(r.settled)), r.settled && r.settled.title);
    chk("voice: no AI filler", !/(let's (explore|dive|unpack)|it sounds like|i hear you|great insight|here's something interesting|what you're really saying)/i.test(all), "");
    chk("writing: no 'is is' / 'whether whether'", !/\b(is is|whether whether|whether where)\b/.test(all), "");
    results.push({ id: sc.id, note: sc.note, checks, pivot: m.pivot.question || m.pivot.kind, leader: m.leader });
  }
  for (const mu of data.mutations) {
    const base = data.scenarios.find(x => x.id === mu.base);
    const s0 = mk(base.session), s1 = mk(base.session);
    Object.entries(mu.set).forEach(([k, v]) => setPath(s1, k, v));
    const m0 = Engine.model(s0), m1 = Engine.model(s1);
    let ok;
    if (mu.expect === "pivot_changes") ok = m0.pivot.question !== m1.pivot.question || m0.pivot.kind !== m1.pivot.kind;
    else if (mu.expect === "pivot_same") ok = m0.pivot.question === m1.pivot.question;
    else if (mu.expect === "leader_changes") ok = m0.leader !== m1.leader;
    else if (mu.expect.startsWith("pivot_kind:")) ok = m1.pivot.kind === mu.expect.split(":")[1];
    else if (mu.expect === "reframe_present") ok = !!Engine.report(s1).reframe;
    muts.push({ id: mu.id, note: mu.note, ok: !!ok, before: m0.pivot.question || m0.pivot.kind, after: m1.pivot.question || m1.pivot.kind });
  }
  document.getElementById("out").textContent = JSON.stringify({ results, muts }, null, 2);
  document.body.dataset.done = "1";
})();
</script></body></html>
