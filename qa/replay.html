<!DOCTYPE html><html><head><meta charset="utf-8"><title>Clarity persona replay</title></head><body>
<pre id="out"></pre>
<script src="../js/content.js"></script><script src="../js/engine.js"></script>
<script>
(async () => {
  const file = new URLSearchParams(location.search).get("file") || "personas/sessions.json";
  const data = await (await fetch(file)).json();
  const IMP = Object.fromEntries(Content.importance), CONFW = Object.fromEntries(Content.confidence);
  const out = [];
  for (const p of data) {
    const sc = p.session;
    const s = { title: sc.title, options: sc.options.map((l, i) => ({ id: "o" + i, label: l })), criteria: sc.criteria.map(([id, label, importance]) => ({ id, label, importance })), evals: {}, notes: sc.notes || {}, ruledOut: sc.ruledOut || {} };
    for (const id in sc.evals) { const e = sc.evals[id]; s.evals[id] = { pref: e.pref, conf: e.conf, ratings: {} }; if (e.ratings) s.options.forEach(o => { s.evals[id].ratings[o.id] = e.ratings[o.label]; }); }
    const L = o => Engine.toYou(o.label), r = Engine.report(s), m = Engine.model(s), pv = Engine.pivot(s);
    const lines = [`=== ${p.id} ===`, `Persona: ${p.persona || ""}`, ``, `--- What the person saw and answered ---`];
    lines.push(`Clarity: What are you deciding?`, `  You: I'm deciding whether to ${s.title}`);
    lines.push(`Clarity: Name the ways this could go.`, `  You: ${s.options.map(L).join(" / ")}`);
    lines.push(`Clarity: What could matter here? (pick everything that matters)`, `  You: ${s.criteria.map(c => c.label).join(", ")}`);
    lines.push(`Clarity: If you couldn't have everything, what would you protect? (how much does each matter)`);
    s.criteria.forEach(c => lines.push(`  ${c.label}: ${IMP[c.importance]}`));
    lines.push(`Clarity: For each one: which is better, and how sure are you?`);
    s.criteria.forEach(c => { const e = s.evals[c.id] || {}; let read; if (typeof e.pref === "number") { const [a, b] = s.options; read = e.pref === 0 ? "about the same" : `${L(e.pref > 0 ? a : b)}${Math.abs(e.pref) === 2 ? ", clearly" : ""}`; } else read = s.options.map(o => `${L(o)} ${["", "poor", "weak", "okay", "good", "strong"][e.ratings[o.id]] || "?"}`).join(", "); lines.push(`  ${c.label}: ${read} · ${CONFW[e.conf] || "?"}`); });
    if (s.notes.hope) { lines.push(`Clarity: What are you hoping changes?`, `  You: ${s.notes.hope}`); const t = Engine.tension(s); if (t) { lines.push(`Clarity: ${t}`, `Clarity: ${Engine.stillWantQuestion(s)}`, `  You: ${s.notes.stillWant}`); const d = Engine.discovery(s); if (d) lines.push(`Clarity: ${d}`); } }
    if (s.notes.worry) lines.push(`Clarity: What are you most worried about?`, `  You: ${s.notes.worry}`);
    if (pv.question) lines.push(`Clarity: If you knew the answer to this, could it change your decision? "${pv.question}"`, `  You: ${s.ruledOut && Object.keys(s.ruledOut).length ? "(earlier candidates ruled out) yes" : "yes"}`);
    lines.push(``, `--- What this depends on (the report) ---`, `${s.title}`, `${s.options.map(L).join(" · ")}`, `What matters most: ${r.matters.join(" · ")}`);
    if (r.reframe) lines.push(`What you're really asking: ${r.reframe.join(" ")}`);
    lines.push(`What appears clear: ${r.clear.concat(r.same).map(x => x.text).join(" ") || "Nothing here."}`, `What you're less certain about: ${r.unsure.map(x => x.text).join(" ") || "Nothing here."}`, `The tension: ${r.tensionLine.text}`);
    lines.push(r.settled ? `Where you are: ${r.settled.title} ${r.settled.body}` : `THE PIVOT: ${r.observation ? r.observation + " " : ""}${r.pivotBlock} ${r.stability}`);
    if (r.changeMind) lines.push(`What could change your mind: ${r.changeMind}`);
    if (r.learn) lines.push(`What might be worth learning: ${r.learn.text}${r.learn.rest.length ? ` ${r.learn.rest.join(" and ")} could matter too, but wouldn't move this as much.` : ""} You don't need more information about everything. You need better information about this.`);
    lines.push(`Now you know what you're deciding.`, ``, `--- Model ---`, JSON.stringify(m), ``);
    out.push(lines.join("\n"));
  }
  document.getElementById("out").textContent = out.join("\n");
  document.body.dataset.done = "1";
})();
</script></body></html>
